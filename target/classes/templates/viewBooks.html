<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Bookify - All Books</title>
<style>
/* Navbar styling */
nav {
	background-color: #ff5700;
	padding: 10px 20px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	color: white;
	font-family: Arial, sans-serif;
}

nav .brand {
	font-size: 24px;
	font-weight: bold;
}

nav .links a {
     margin: 0 50px;
	text-decoration: none;
	color: white;
	font-size: 16px;
}

nav .links a:hover {
	text-decoration: underline;
}

/* Table styling */
table {
	width: 80%;
	margin: 20px auto;
	border-collapse: collapse;
	font-family: Arial, sans-serif;
}

th, td {
	border: 2px solid rgb(0, 0, 0);
	padding: 8px;
	text-align: left;
}

th {
	background-color: rgb(0, 128, 192);
	color: white;
}


tr:hover {
	background-color: #d6dbdf;
}

/* Links styling */
a.btn {
	display: inline-block;
	background-color: #27ae60;
	color: white;
	padding: 6px 12px;
	margin-bottom: 15px;
	border-radius: 4px;
	text-decoration: none;
}

a.btn:hover {
	background-color: #1e8449;
}



.actions a {
	margin: 0 5px;
	text-decoration: none;
	padding: 4px 8px;
	border-radius: 4px;
	color: white;
}

.actions a.edit {
	background-color: #2980b9;
}

.actions a.delete {
	background-color: #c0392b;
}

.actions a:hover {
	opacity: 0.8;
}

.count {
	text-align: center;
	font-weight: bold;
	margin-top: 10px;
	font-family: Arial, sans-serif;
}

.alert {
        width: 300px;
        padding: 10px 15px;
        margin: 15px auto;
        border-radius: 5px;
        color: white;
        text-align: center;
        font-family: Arial, sans-serif;
        font-weight: bold;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .alert-success {
        background-color: #27ae60; /* green */
    }

    .alert-error {
        background-color: #c0392b; /* red */
    }


</style>
</head>
<body>

	<!-- Navbar -->
	<nav>
		<div class="brand">Bookify</div>
		<div class="links">
			<a th:href="@{/}">Home</a> <a th:href="@{/allBooks}">All Books</a> <a
				th:href="@{/bookform}">Add Book</a>
		</div>
	</nav>
	
	<p th:if="${success}" th:text="${success}" class="alert alert-success"></p>
	<p th:if="${error}" th:text="${error}" class="alert alert-error"></p>

	<h2 style="text-align: center; margin-top: 20px;">All available
		books</h2>

	<div style="text-align: center; margin-top: 10px;">
		<a th:href="@{/bookform}" class="btn">Add New Book</a>
	</div>

	<table>
		<thead>
			<tr>
				<th>Sr. No.</th>
				<th>Title</th>
				<th>Author</th>
				<th>Price</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="book,iterator: ${books}">
				<td th:text="${iterator.index+1}"></td>
				<td th:text="${book.title}"></td>
				<td th:text="${book.author}"></td>
				<td th:text="${book.price}"></td>
				<td class="actions"><a
					th:href="@{/EditBookForm?(bookId=${book.bookId})}" class="edit">Edit</a>
					<a th:href="@{/deleteBook?(bookId=${book.bookId})}" class="delete" onclick="return confirmDelete();">Delete</a>
				</td>
			</tr>

			<tr th:if="${books.isEmpty()}">
				<td colspan="5" style="text-align: center;">No books available.</td>
			</tr>
		</tbody>
	</table>

	<div class="count">
		Total Books: <span th:text="${books.size()}"></span>
	</div>
	
	<script type="text/javascript">
			function confirmDelete()
			{
				return confirm("Are you sure you want to delete this book");
			}
		
	</script>

</body>
</html>
